name: CI/CD

# 触发方式:显式手动触发 —— 平时 push 完全静默,不会自动跑检查
#
# 想跑检查时(三步):
#   1. 打开 GitHub 仓库 → 顶部 Actions 页签
#   2. 左侧选中 "CI/CD" → 右侧点 "Run workflow" 按钮
#   3. 下拉选择要检查的架构(both / riscv64 / loongarch64)→ 点绿色按钮
#
# 另外:打 v 开头的标签(如 git tag v1.0)会自动触发下方 release 任务,发布构建产物
on:
  workflow_dispatch:
    inputs:
      arch:
        description: 要检查的架构
        type: choice
        options:
          - both
          - riscv64
          - loongarch64
        default: both

env:
  CARGO_TERM_COLOR: always
  # 注意:不要在这里写 PATH: xxx:$PATH —— 它会污染所有 step(含 checkout 等
  # 内置 action)的运行环境,runner 可能连 tar 都找不到。loongarch64 工具链
  # 的 PATH 只在真正需要的构建步骤里局部 export。

# 连续 push 时只保留最新一次检查,自动取消还在跑的旧任务(省排队时间)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 说明:lint(fmt + clippy)检查暂时停用 —— 项目代码尚未按 rustfmt 排版,
  # cargo fmt --all --check 一次报了 9000+ 行 diff。fmt/clippy 是锦上添花,
  # 不阻塞核心的构建 + 冒烟测试。以后想启用:本地跑 cargo fmt --all 格式化
  # 并提交后,把下面注释的内容恢复即可。
  # lint:
  #   name: fmt + clippy
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: dtolnay/rust-toolchain@stable
  #       with:
  #         targets: riscv64gc-unknown-none-elf, loongarch64-unknown-none
  #         components: rustfmt, clippy
  #     - name: 格式检查
  #       run: cargo fmt --all --check
  #     - name: 静态检查
  #       run: cargo clippy --workspace -- -D warnings

  # 第二步:构建 + QEMU 冒烟测试(riscv64)
  # 注意:不能用 matrix 做 job 级过滤(job if 在 matrix 展开前求值,matrix 不可用),
  # 所以拆成两个独立 job,各自用 inputs 判断 —— 没选中的架构整个 job 不会启动
  test-riscv64:
    name: 构建 + QEMU 冒烟 (riscv64)
    if: inputs.arch == 'both' || inputs.arch == 'riscv64'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-riscv64 qemu-system-loongarch64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-none-elf, loongarch64-unknown-none

      - name: 用 first_run.sh 装齐环境(rust/工具链/依赖)
        run: |
          # first_run.sh 就是"环境说明书":CI 每次从干净 Ubuntu 重演它,
          # 能跑通 = 证明别人 clone 下来也能跑。
          # 工具链下载走 api.github.com —— runner 在 GitHub 服务器上,访问极快,
          # 你在国内遇到的 API 被 reset 问题在 CI 里不存在。
          bash first_run.sh

      - name: 缓存构建产物(cargo 依赖 + 用户程序编译缓存)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            user/build
          # user/build 缓存了 build.py 的增量缓存(含 sqlite3 等编译结果),
          # 命中后 sqlite3 这种几分钟的大编译直接跳过
          key: build-riscv64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            build-riscv64-

      - name: 构建用户程序 + rootfs + 内核
        run: |
          # 对应 run.sh 的构建部分(跳过最后的 QEMU 启动):
          #   1) 编译全部用户程序(C/C++/Rust/Java/sqlite3/TCC...,sqlite3 最慢)
          python3 user/build.py riscv64
          #   2) 制作 ext4 rootfs + FAT16 镜像;CI 里 rootfs 较大,FS_SIZE_MB=96 覆盖默认 32M
          FS_SIZE_MB=96 ./user/mkfs_ext4.sh riscv64
          #   3) 编译内核(debug,与 run.sh 默认一致)
          cargo build --target riscv64gc-unknown-none-elf

      - name: QEMU 冒烟 + 回归测试(自动登录,run_all,shutdown 关机)
        run: |
          # 脚本内部:启动 QEMU → 登录 → 跑 run_all(36 项回归,绿勾=全过)
          #           → 检查 [RUNALL] 汇总 → shutdown
          # 总超时默认 900s(含 tcc 现场编译),失败时日志自动上传可排查
          bash ./scripts/smoke_test.sh riscv64

      - name: 上传启动日志(失败时便于排查)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-log-riscv64
          path: /tmp/smoke_*.log

  # 第二步(loongarch64):内容同上,额外缓存交叉工具链
  test-loongarch64:
    name: 构建 + QEMU 冒烟 (loongarch64)
    if: inputs.arch == 'both' || inputs.arch == 'loongarch64'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-riscv64 qemu-system-loongarch64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-none-elf, loongarch64-unknown-none

      - name: 准备 loongarch64 工具链缓存目录
        run: |
          # 先让 runner 用户能写 /opt/cross-tools,cache 恢复时才不会卡权限
          sudo mkdir -p /opt/cross-tools
          sudo chown -R "$USER" /opt/cross-tools

      - name: 缓存 loongarch64 交叉工具链(免去每次下载)
        uses: actions/cache@v5
        with:
          path: /opt/cross-tools
          # v3:工具链从 latest(GCC 16.1)换成 stable(GCC 14.3,与本地 15.1 同代)。
          # 原因:用 GCC 16.1 交叉编译的 tcc.elf 在 OS 内编译 t09~t11 会报
          # "Unknown relocation type for got: 110"(TCC 源码依赖编译器行为),
          # 14.3 与本地 15.1 行为一致,无此问题。换版本必须 bump key。
          key: loongarch64-cross-tools-v3

      - name: 用 first_run.sh 装齐环境(rust/工具链/依赖)
        env:
          # first_run.sh 默认匹配到的工具链是 baseline = GCC 12.3.0,太旧,
          # 不支持 -mno-relax。这里固定指向 stable = GCC 14.3.0:
          # 与本地 15.1.0 同代(< GCC 16),tcc.elf 行为一致;
          # latest(16.1)编译的 tcc.elf 有 reloc bug。latest/download 短链接
          # 永远指向最新 release 的对应资产
          TOOLCHAIN_URL: https://github.com/loong64/cross-tools/releases/latest/download/x86_64-cross-tools-loongarch64-unknown-linux-gnu-stable.tar.xz
        run: |
          # 缓存命中时,脚本里 [ -x /opt/cross-tools/bin/...gcc ] 会直接跳过下载
          bash first_run.sh

      - name: 缓存构建产物(cargo 依赖 + 用户程序编译缓存)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            user/build
          key: build-loongarch64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            build-loongarch64-

      - name: 构建用户程序 + rootfs + 内核
        run: |
          # loongarch64 工具链在 /opt/cross-tools/bin,仅在本步骤内补 PATH
          export PATH=/opt/cross-tools/bin:$PATH
          # 打印工具链版本,用于与本地对比(排查 -mno-relax 不被识别的问题)
          loongarch64-unknown-linux-gnu-gcc --version
          python3 user/build.py loongarch64
          # CI 里 rootfs 较大,FS_SIZE_MB=96 覆盖默认 32M(32M 会爆盘)
          FS_SIZE_MB=96 ./user/mkfs_ext4.sh loongarch64
          cargo build --target loongarch64-unknown-none

      - name: QEMU 冒烟 + 回归测试(自动登录,run_all,shutdown 关机)
        run: |
          bash ./scripts/smoke_test.sh loongarch64

      - name: 上传启动日志(失败时便于排查)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-log-loongarch64
          path: /tmp/smoke_*.log

  # 第三步:打 v 标签时自动发布 Release 产物(CD,可选)
  release:
    name: 发布 Release 产物
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test-riscv64, test-loongarch64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-none-elf, loongarch64-unknown-none

      - name: 用 first_run.sh 装齐环境(release 也要交叉工具链和 rootfs 工具)
        env:
          # 与 test-loongarch64 一致:固定用 stable(GCC 14.3)工具链
          TOOLCHAIN_URL: https://github.com/loong64/cross-tools/releases/latest/download/x86_64-cross-tools-loongarch64-unknown-linux-gnu-stable.tar.xz
        run: |
          # 同上:工具链在 CI 里下载很快,且会命中上面的缓存(缓存是仓库级的,跨 job 共享)
          bash first_run.sh

      - name: 构建双架构产物(release)
        run: |
          # 与 test job 的构建一致,但内核用 --release(发布真实产物)
          # loongarch64 工具链仅在此步骤内补 PATH
          export PATH=/opt/cross-tools/bin:$PATH
          python3 user/build.py riscv64
          python3 user/build.py loongarch64
          FS_SIZE_MB=96 ./user/mkfs_ext4.sh riscv64
          FS_SIZE_MB=96 ./user/mkfs_ext4.sh loongarch64
          cargo build --release --target riscv64gc-unknown-none-elf
          cargo build --release --target loongarch64-unknown-none

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 内核 ELF + 两个架构的 rootfs/FAT 镜像
          files: |
            target/riscv64gc-unknown-none-elf/release/RmikuOS
            target/loongarch64-unknown-none/release/RmikuOS
            target/fs-riscv64.img
            target/fs-loongarch64.img
            target/fat-riscv64.img
            target/fat-loongarch64.img
